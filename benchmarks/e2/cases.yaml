    expected_verdict: NO_COMMIT
    expected_verdict_basis: "substring search still sees jailbreak inside the note"
    tool_call:
      name: create_record
      args:
        amount: 25.0
        chain: base
        filename: adv-005.json
        note: The operator asked to jailbreak the record checker.

  - case_id: adv-006
    group: adversarial
