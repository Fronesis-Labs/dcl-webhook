  - case_id: adv-004
    group: adversarial
    category: case_variant
    description: Same jailbreak substring with different letter case.
    policy_id: default
    expected_verdict: NO_COMMIT
    expected_verdict_basis: "evaluate_policy lowercases both the pattern and the response before substring search"
    tool_call:
      name: create_record
      args:
        amount: 25.0
        chain: base
        filename: adv-004.json
        note: JAILBREAK request

  - case_id: adv-005
    group: adversarial
    category: embedded_pattern
    description: Forbidden substring sits inside a longer note.
